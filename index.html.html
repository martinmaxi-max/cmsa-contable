<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111;}
.nav{background:#0f172a;display:flex;align-items:center;padding:0 12px;min-height:46px;gap:2px;flex-wrap:wrap;}
.nav-title{color:#fff;font-weight:800;font-size:13px;margin-right:8px;white-space:nowrap;}
.nav-btn{background:transparent;color:rgba(255,255,255,.5);border:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:6px 9px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;}
.nav-btn.active{background:rgba(255,255,255,.12);color:#fff;border-bottom-color:#60a5fa;}
.mes-sel{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:7px;padding:4px 10px;font-size:12px;margin-left:auto;}
.page{max-width:1200px;margin:0 auto;padding:16px 14px;}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar h2{font-size:16px;font-weight:700;color:#111;}
.cuadre{font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid;}
.cuadre.ok{background:#dcfce7;color:#166534;border-color:#86efac;}
.cuadre.mal{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.btn{background:#fff;color:#374151;border:1px solid #d1d5db;border-radius:7px;padding:5px 13px;cursor:pointer;font-size:12px;font-weight:600;transition:background .1s;}
.btn:hover{background:#f9fafb;}
.btn.primary{background:#1a56db;color:#fff;border-color:#1a56db;}
.btn.primary:hover{background:#1546b8;}
.btn.outline-v{color:#6366f1;border-color:#a5b4fc;background:transparent;}
.btn.danger{color:#b91c1c;border-color:#fca5a5;background:transparent;}
.btn.sm{padding:3px 10px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.empty{text-align:center;padding:48px 20px;color:#6b7280;font-size:13px;background:#fff;border-radius:10px;border:1px dashed #d1d5db;}
.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;margin-bottom:10px;}
.card-head{background:#f8fafc;border-bottom:1px solid #e5e7eb;padding:9px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-radius:10px 10px 0 0;}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.bl{background:#dbeafe;color:#1e40af;}
.badge.gn{background:#dcfce7;color:#166534;}
.badge.am{background:#fef3c7;color:#92400e;}
.badge.gr{background:#f1f5f9;color:#475569;}
.badge.rd{background:#fee2e2;color:#991b1b;}
.badge.pu{background:#ede9fe;color:#5b21b6;}
.badge.cy{background:#cffafe;color:#0e7490;}
select.tipo-sel{border:1px solid #d1d5db;border-radius:6px;padding:3px 8px;font-size:11px;background:#fff;flex:1;min-width:180px;max-width:360px;}
/* TABLA DE LÍNEAS */
table.lt{width:100%;border-collapse:collapse;table-layout:fixed;}
table.lt th{background:#f1f5f9;padding:6px 8px;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;white-space:nowrap;text-align:left;}
table.lt td{padding:3px 5px;border-bottom:1px solid #f9fafb;vertical-align:middle;}
.tb{width:28px;height:24px;border-radius:4px;border:none;cursor:pointer;font-weight:800;font-size:11px;}
.tb.d{background:#dcfce7;color:#166534;}.tb.h{background:#fef3c7;color:#92400e;}.tb.n{background:#f1f5f9;color:#64748b;}
.tb.formula{background:#ede9fe;color:#5b21b6;font-size:10px;}
input.ci{width:100%;border:1px solid #e5e7eb;border-radius:5px;padding:4px 8px;font-size:12px;background:#fff;color:#111;outline:none;}
input.ci:focus{border-color:#93c5fd;}
input.ii{width:100%;border:1px solid #e5e7eb;border-radius:5px;padding:4px 8px;font-size:12px;text-align:right;font-family:monospace;background:#fff;color:#111;outline:none;}
input.ii:focus{border-color:#93c5fd;}
input.ii.d{color:#059669;}
input.ii.h{color:#b45309;}
input.ii.formula{background:#faf5ff;color:#7c3aed;font-style:italic;}
input.ii:disabled{background:#f9fafb;color:#9ca3af;cursor:not-allowed;}
/* Selector código chino en línea */
select.cc-sel{width:100%;border:1px solid #e0e7ff;border-radius:5px;padding:3px 5px;font-size:10px;background:#f5f3ff;color:#4338ca;outline:none;}
select.cc-sel:focus{border-color:#818cf8;}
/* AUTOCOMPLETE */
.ac-wrap{position:relative;width:100%;}
.ac-list{position:absolute;top:100%;left:0;right:0;z-index:600;background:#fff;border:1px solid #d1d5db;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.1);max-height:200px;overflow-y:auto;}
.ac-it{padding:6px 11px;font-size:12px;cursor:pointer;color:#111;}
.ac-it:hover,.ac-it.sel{background:#eff6ff;}
/* DROPDOWN */
.drop-wrap{position:relative;}
.drop{position:absolute;right:0;top:calc(100% + 4px);z-index:500;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.13);min-width:300px;max-height:380px;overflow-y:auto;}
.di{padding:8px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f9fafb;}
.di:hover{background:#eff6ff;}
/* MAYORES */
table.mt{width:100%;border-collapse:collapse;}
table.mt th{background:#f1f5f9;padding:7px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap;}
table.mt th:first-child,table.mt th:nth-child(2){text-align:left;}
table.mt td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f9fafb;text-align:right;font-family:monospace;}
table.mt td:first-child,table.mt td:nth-child(2){text-align:left;font-family:system-ui;font-size:12px;}
table.mt tr:nth-child(even){background:#f8fafc;}
table.mt .tot-row{background:#f1f5f9;border-top:2px solid #e2e8f0;font-weight:800;}
/* CUENTAS */
table.ct{width:100%;border-collapse:collapse;}
table.ct th{background:#f1f5f9;padding:7px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;}
table.ct td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f9fafb;}
table.ct tr:nth-child(even){background:#f8fafc;}
input.si{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px;outline:none;color:#111;}
input.fi{border:1px solid #d1d5db;border-radius:7px;padding:6px 10px;font-size:13px;outline:none;color:#111;}
/* SALDOS INICIALES */
table.sit{width:100%;border-collapse:collapse;}
table.sit th{background:#f1f5f9;padding:7px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;}
table.sit td{padding:5px 8px;border-bottom:1px solid #f9fafb;font-size:12px;}
table.sit tr:nth-child(even){background:#f8fafc;}
input.si2{border:1px solid #e5e7eb;border-radius:5px;padding:4px 8px;font-size:12px;width:140px;text-align:right;font-family:monospace;outline:none;}
input.si2:focus{border-color:#93c5fd;}
/* BARRA DE CONTEXTO: empresa / ejercicio / periodo */
.ctx{background:#1e293b;display:flex;align-items:center;gap:7px;padding:6px 16px;flex-wrap:wrap;border-bottom:1px solid #334155;}
.ctx-lb{color:#94a3b8;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.ctx-sel{background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:3px 9px;font-size:12px;max-width:280px;}
.ctx-sel:focus{outline:none;border-color:#60a5fa;}
.save-ind{color:#64748b;font-size:11px;margin-left:auto;white-space:nowrap;padding-right:2px;}

.save-ind.otro{color:#fcd34d;font-weight:700;}
.login-ov{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:9000;}
.login-bx{background:#fff;border-radius:14px;padding:28px 26px;width:330px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.login-bx h1{font-size:16px;margin-bottom:4px;color:#111;}
.login-bx p{font-size:12px;color:#6b7280;margin-bottom:16px;}
.login-bx input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:9px;outline:none;}
.login-bx input:focus{border-color:#60a5fa;}
.login-bx button{width:100%;background:#1a56db;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
.login-bx button:hover{background:#1546b8;}
.lg-msg{font-size:12px;color:#6b7280;margin-top:10px;min-height:16px;text-align:center;}
.lg-msg.err{color:#b91c1c;font-weight:600;}
.mini{font-size:11px;color:#6b7280;}
.subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid #e5e7eb;padding-bottom:8px;}
.subtab{background:#fff;border:1px solid #d1d5db;border-radius:7px;padding:5px 14px;font-size:12px;font-weight:600;color:#374151;cursor:pointer;}
.subtab:hover{background:#f9fafb;}
.subtab.on{background:#1a56db;border-color:#1a56db;color:#fff;}
table.emp{width:100%;border-collapse:collapse;}
table.emp th{background:#f1f5f9;padding:7px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;text-align:left;}
table.emp td{padding:6px 10px;font-size:12px;border-bottom:1px solid #f9fafb;}
table.emp tr:nth-child(even){background:#f8fafc;}
</style>
</head>

<div class="login-ov" id="login" style="display:none">

    <h1>&#x1F4D2; Sistema Contable</h1>

    <button onclick="loginEntrar()">Entrar</button>

  </div>
</div>

// Estructura en Firestore:
//   config/general                  -> empresas, ejercicios, plan de cuentas, equivalencias
//   ejercicios/{ejId}               -> saldos iniciales
//   ejercicios/{ejId}/meses/{per}   -> asientos de ese mes

const DOC_CFG=()=>fb.db.collection("config").doc("general");

function estado(tipo,txt){
  const el=document.getElementById("saveInd");if(!el)return;
  const p=n=>String(n).padStart(2,"0");
  if(tipo==="ok"){const f=new Date();el.className="save-ind ok";el.title="Guardado en la nube";el.textContent="\u2713 "+p(f.getHours())+":"+p(f.getMinutes());}
  else if(tipo==="guardando"){el.className="save-ind";el.title="";el.textContent="Guardando\u2026";}
  else if(tipo==="err"){el.className="save-ind err";el.title=txt||"";el.textContent="\u26A0 Sin guardar";}
  else{el.className="save-ind";el.title="";el.textContent=txt||"";}
}
function avisarOtro(){
  const el=document.getElementById("saveInd");if(!el)return;
  el.className="save-ind otro";el.textContent="\u21BB Actualizado por el otro usuario";
  setTimeout(()=>estado("ok"),4000);
}

function loginVer(v){
  const el=document.getElementById("login");if(el)el.style.display=v?"flex":"none";
  const b=document.getElementById("btnSalir");if(b)b.style.display=v?"none":"";

function loginMsg(t,err){const el=document.getElementById("lg-msg");if(el){el.textContent=t;el.className=err?"lg-msg err":"lg-msg";}}
function loginEntrar(){
  const e=(document.getElementById("lg-mail")||{}).value,p=(document.getElementById("lg-pass")||{}).value;
  if(!e||!p){loginMsg("Completá correo y contraseña.",true);return;}
  loginMsg("Entrando\u2026");
  fb.auth.signInWithEmailAndPassword(String(e).trim(),p).catch(err=>loginMsg(fbErr(err),true));
}
function loginTecla(ev){if(ev.key==="Enter")loginEntrar();}
function fbErr(err){
  const m={"auth/invalid-email":"El correo no es válido.",
    "auth/user-not-found":"No existe ese usuario.",
    "auth/wrong-password":"Contraseña incorrecta.",
    "auth/invalid-credential":"Correo o contraseña incorrectos.",
    "auth/too-many-requests":"Demasiados intentos fallidos. Esperá unos minutos.",
    "auth/network-request-failed":"Sin conexión a internet.",
    "permission-denied":"El usuario no tiene permiso. Revisá las reglas de Firestore.",
    "unavailable":"Sin conexión con la base de datos."};
  return m[err&&err.code]||("Error: "+((err&&err.message)||err));
}
function salir(){
  if(!confirm("¿Cerrar sesión?"))return;
  if(unsubCfg){unsubCfg();unsubCfg=null;}
  if(unsubEj){unsubEj();unsubEj=null;}
  fb.auth.signOut();
}

function fbInit(){
  firebase.initializeApp(FB_CONFIG);
  fb.db=firebase.firestore();
  fb.auth=firebase.auth();
  fb.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  fb.auth.onAuthStateChanged(u=>{
    fb.user=u;
    if(u){loginVer(false);arrancarNube();}
    else{loginVer(true);loginMsg("");}
  });
}

// ─── CARGA ───────────────────────────────────────────────────────────────────
async function arrancarNube(){
  estado("info","Cargando\u2026");
  try{
    const snap=await DOC_CFG().get();
    if(snap.exists){
      const d=JSON.parse(snap.data().datos||"{}");
      DB=Object.assign(dbVacia(),d);
      DB.saldos={};DB.asientos={};
    }else{
      // Primera vez: si hay algo guardado en este navegador, se sube.
      const local=leerLocal();
      DB=local||dbVacia();
      await subirTodo();
      if(local)alert("Se subieron a la nube los datos que tenías en este navegador.");
    }
    if(!DB.cuentas||!DB.cuentas.length)DB.cuentas=MC_BASE.map(x=>({...x}));
    if(!DB.mapCompras)DB.mapCompras={...MAP_COMPRAS_BASE};
    MC=DB.cuentas;
    _sync.cfg=JSON.stringify(cfgPlano());
    escucharCfg();
    await abrirEjercicio(DB.ejercicios.length?DB.ejercicios[0].id:null);
  }catch(e){
    estado("err",e.message);
    alert("No pude cargar los datos: "+fbErr(e));
  }
}
function leerLocal(){
  try{
    const s=localStorage.getItem(LS_KEY);
    if(s){const d=JSON.parse(s);if(d&&d.empresas&&d.ejercicios&&d.cuentas)return d;}
  }catch(e){}
  return null;
}
async function abrirEjercicio(id){
  if(unsubEj){unsubEj();unsubEj=null;}
  _sync.saldos="";_sync.meses={};
  if(!id){activarEjercicio(null);render();estado("ok");return;}
  estado("info","Abriendo ejercicio\u2026");
  const [ejSnap,mesSnap]=await Promise.all([DOC_EJ(id).get(),COL_MESES(id).get()]);
  DB.saldos[id]=(ejSnap.exists&&ejSnap.data().saldos)?JSON.parse(ejSnap.data().saldos):{};
  const as={};
  mesSnap.forEach(d=>{as[parseInt(d.id,10)]=JSON.parse(d.data().datos||"[]");});
  DB.asientos[id]=as;
  _sync.saldos=JSON.stringify(DB.saldos[id]);
  Object.keys(as).forEach(k=>{_sync.meses[k]=JSON.stringify(as[k]);});
  activarEjercicio(id);
  escucharEj(id);
  estado("ok");
  render();
}
function escucharCfg(){
  if(unsubCfg)unsubCfg();
  unsubCfg=DOC_CFG().onSnapshot(snap=>{
    if(!snap.exists)return;
    const d=snap.data();
    if(d._by===CLIENT_ID)return;
    const j=d.datos||"";
    if(j===_sync.cfg)return;
    const c=JSON.parse(j);
    DB.empresas=c.empresas;DB.ejercicios=c.ejercicios;DB.cuentas=c.cuentas;DB.mapCompras=c.mapCompras;
    MC=DB.cuentas;_sync.cfg=j;
    avisarOtro();render();
  },err=>estado("err",err.message));
}
function escucharEj(id){
  unsubEj=COL_MESES(id).onSnapshot(snap=>{
    let n=0;
    snap.docChanges().forEach(ch=>{
      const per=parseInt(ch.doc.id,10);
      if(ch.type==="removed"){
        if(DB.asientos[id])delete DB.asientos[id][per];
        delete _sync.meses[per];n++;return;
      }
      const d=ch.doc.data();
      if(d._by===CLIENT_ID)return;
      const j=d.datos||"[]";
      if(_sync.meses[per]===j)return;
      DB.asientos[id][per]=JSON.parse(j);
      _sync.meses[per]=j;n++;
    });
    if(n){avisarOtro();render();}
  },err=>estado("err",err.message));
}

async function guardarNube(){
  if(!fb.user||!DB)return;
  const t=[],now=Date.now();
  const jc=JSON.stringify(cfgPlano());
  if(jc!==_sync.cfg)t.push(DOC_CFG().set({datos:jc,_by:CLIENT_ID,_at:now}).then(()=>{_sync.cfg=jc;}));
  const id=E.ej;
  if(id){
    const js=JSON.stringify(DB.saldos[id]||{});
    if(js!==_sync.saldos)t.push(DOC_EJ(id).set({saldos:js,_by:CLIENT_ID,_at:now},{merge:true}).then(()=>{_sync.saldos=js;}));
    const as=DB.asientos[id]||{};
    Object.keys(as).forEach(per=>{
      const j=JSON.stringify(as[per]||[]);
      if(j===_sync.meses[per])return;
      if(j.length>900000){alert("El mes "+perLabel(parseInt(per,10))+" quedó demasiado grande para guardarse. Avisá para partirlo.");return;}
      t.push(COL_MESES(id).doc(String(per)).set({datos:j,_by:CLIENT_ID,_at:now}).then(()=>{_sync.meses[per]=j;}));
    });
  }
  if(!t.length)return;
  estado("guardando");
  try{await Promise.all(t);estado("ok");}
  catch(e){estado("err",fbErr(e));}
}

// Compara el I.V.A. Débito Fiscal cargado en "Ventas del mes" (Haber) contra el
// cargado en "Asiento I.V.A. del mes" (Debe). Ambos son manuales; deben coincidir.
function getIvaCheck(mes){
  const list=E.apm[mes]||[];
  let vVentas=0,vAsiento=0;
  list.forEach(a=>{
    a.lineas.forEach(l=>{
      if(l.cuenta!=="I.V.A. DÉBITO FISCAL")return;
      if(a.tipo==="POR VENTAS DEL MES S/ LIBRO I.V.A."&&l._t==="H"){
        vVentas+=l.formula?calcFormula(a,l):pn(l.haber);
      }
      if(a.tipo==="POR ASIENTO I.V.A. DEL MES"&&l._t==="D"){
        vAsiento+=l.formula?calcFormula(a,l):pn(l.debe);
      }
    });
  });
  return{vVentas,vAsiento,diff:vVentas-vAsiento,ok:Math.abs(vVentas-vAsiento)<0.02,hay:vVentas>0||vAsiento>0};
}

// Saldo neto (Debe-Haber) de una cuenta acumulado hasta el cierre de un mes dado
// (sin incluir ese mes) + saldo inicial. Sirve para saber cuánto arrastrar
// (ej: SDO. FAVOR IMP A LOS INGRESOS BRUTOS) al asiento del mes siguiente.
function saldoCuentaHastaMes(cuenta,mesLimite){
  let d=0,h=0;
  const si=SALDOS_INIT[cuenta];
  if(si){d+=si.d||0;h+=si.h||0;}
  for(let m=0;m<mesLimite;m++){
    (E.apm[m]||[]).forEach(a=>{
      a.lineas.forEach(l=>{
        if(l.cuenta!==cuenta)return;
        let dv=pn(l.debe),hv=pn(l.haber);
        if(l.formula){const v=calcFormula(a,l);if(l._t==="D")dv=v;else hv=v;}
        d+=dv;h+=hv;
      });
    });
  }
  return d-h;
}

function calcFormula(asiento, lineaFormula){
  const otrasD=asiento.lineas.filter(l=>l.id!==lineaFormula.id&&!l.formula).reduce((s,l)=>s+pn(l.debe),0);
  const otrasH=asiento.lineas.filter(l=>l.id!==lineaFormula.id&&!l.formula).reduce((s,l)=>s+pn(l.haber),0);
  if(lineaFormula._t==="D") return Math.max(0, otrasH - otrasD);
  else return Math.max(0, otrasD - otrasH);
}

}

// ─── REPARTO AUTOMÁTICO (ej: Caja 20% / Deudores 80% en Ventas del mes) ───────
// Por defecto reparte el total del lado opuesto (Ventas+IVA) según los % definidos.
// Si el usuario edita una de las líneas manualmente, la otra se recalcula para
// que la suma siga cerrando (ej: más en Caja => menos en Deudores).
function recalcAutoSplit(aid){
  const a=getMes().find(x=>x.id===aid);
  if(!a)return;
  const autoLs=a.lineas.filter(l=>l.autoSplit!=null);
  if(!autoLs.length)return;
  const lado=autoLs[0]._t; // lado (D o H) donde están las líneas de reparto
  const ladoOp=lado==="D"?"haber":"debe";
  const campo=lado==="D"?"debe":"haber";
  const target=a.lineas.filter(l=>l.autoSplit==null&&!l.formula).reduce((s,l)=>s+pn(l[ladoOp]),0);
  const manualId=a.manualAuto&&autoLs.some(l=>l.id===a.manualAuto)?a.manualAuto:null;
  if(manualId){
    const manual=autoLs.find(l=>l.id===manualId);
    const otras=autoLs.filter(l=>l.id!==manualId);
    const manualVal=pn(manual[campo]);
    const rem=Math.max(0,target-manualVal);
    const sumPct=otras.reduce((s,l)=>s+l.autoSplit,0)||1;
    otras.forEach(l=>{const v=rem*(l.autoSplit/sumPct);l[campo]=numStr(v);});
  }else{
    autoLs.forEach(l=>{const v=target*l.autoSplit;l[campo]=numStr(v);});
  }
}
function resetAutoSplit(aid){
  const a=getMes().find(x=>x.id===aid);
  if(!a)return;
  a.manualAuto=null;recalcAutoSplit(aid);render();
}

// ─── LECTURA DE ARCHIVOS ─────────────────────────────────────────────────────
function numAR(s){
  if(s==null)return 0;
  const t=String(s).replace(/[^0-9.,-]/g,"");
  if(!t||t==="-")return 0;
  const v=parseFloat(t.replace(/\./g,"").replace(",","."));
  return isNaN(v)?0:v;
}
function numExcel(v){if(v==null||v==="")return 0;if(typeof v==="number")return v;return numAR(v);}
// Interpreta la celda de fecha: Date de Excel, número de serie, dd/mm/aaaa o aaaa-mm.
function ymCelda(v){
  if(v instanceof Date)return{y:v.getFullYear(),m:v.getMonth()};
  if(typeof v==="number"&&v>20000&&v<80000){
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    return{y:d.getUTCFullYear(),m:d.getUTCMonth()};
  }
  const t=String(v==null?"":v).trim();
  let m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let y=parseInt(m[3],10);if(y<100)y+=2000;return{y,m:parseInt(m[2],10)-1};}
  m=t.match(/^(\d{4})[\/\-.](\d{1,2})/);
  if(m)return{y:parseInt(m[1],10),m:parseInt(m[2],10)-1};
  const d=new Date(t);
  if(!isNaN(d)&&t.length>5)return{y:d.getFullYear(),m:d.getMonth()};
  return null;
}
function leerExcel(file,cb){
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
      cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}));
    }catch(err){impError("No pude leer el Excel: "+err.message);}
  };
  r.readAsArrayBuffer(file);
}

function leerPDF(file,cb){
  if(!window.pdfjsLib){impError("No se cargó la librería de PDF. Revisá la conexión a internet y recargá.");return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const r=new FileReader();
  r.onload=function(ev){
    pdfjsLib.getDocument({data:new Uint8Array(ev.target.result)}).promise.then(async pdf=>{
      const out=[];
      for(let p=1;p<=pdf.numPages;p++){
        const tc=await (await pdf.getPage(p)).getTextContent();
        const filas={};
        tc.items.forEach(it=>{
          if(!it.str||!it.str.trim())return;
          const y=Math.round(it.transform[5]/2)*2;
          (filas[y]=filas[y]||[]).push({x:it.transform[4],s:it.str});
        });
        Object.keys(filas).map(Number).sort((a,b)=>b-a).forEach(y=>{
          out.push(filas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim());
        });
      }
      cb(out);
    }).catch(err=>impError("No pude leer el PDF: "+err.message));
  };
  r.readAsArrayBuffer(file);
}
function impError(m){E.imp.err=m;E.imp.prop=null;render();}
function lineaNums(l){return String(l||"").match(/-?\d{1,3}(?:\.\d{3})*,\d{2}/g)||[];}
// Busca una etiqueta y devuelve el último número de esa línea; si el PDF partió
// la etiqueta y el importe en dos renglones, mira los dos siguientes.
function valEtiqueta(ls,re){
  const i=ls.findIndex(l=>re.test(l));
  if(i<0)return null;
  for(let j=i;j<Math.min(i+3,ls.length);j++){
    const n=lineaNums(ls[j]);
    if(n.length)return numAR(n[n.length-1]);
    if(j>i&&/^[-\s$+]*$/.test(ls[j]))return 0;
  }
  return 0;
}

// ─── ARMADO DE ASIENTOS ──────────────────────────────────────────────────────
// valores: {"CUENTA|D":importe, ...}. Usa la plantilla del tipo para conservar
// las líneas de fórmula y el orden; agrega las cuentas que no estén.
function buildDesdePlantilla(tipo,valores,meta){
  const a=crA(tipo);
  Object.keys(valores).forEach(k=>{
    const p=k.lastIndexOf("|");
    const cuenta=k.slice(0,p),lado=k.slice(p+1);
    const v=valores[k];
    let l=a.lineas.find(x=>x.cuenta===cuenta&&x._t===lado&&!x.formula);
    if(!l){
      l={id:nid(),cuenta,codigo:cod(cuenta),ccodigo:ccod(cuenta),debe:"",haber:"",
         _t:lado,formula:false,autoSplit:null,swing:null};
      const iCierre=a.lineas.findIndex(x=>x.formula);
      if(iCierre>=0)a.lineas.splice(iCierre,0,l);else a.lineas.push(l);
    }
    if(lado==="D"){l.debe=numStr(v);l.haber="";}
    else{l.haber=numStr(v);l.debe="";}
  });
  if(meta)Object.assign(a,meta);
  return a;
}

// ─── LÍNEAS DERIVADAS (crédito fiscal DTO 814) ───────────────────────────────
// El 814 se carga en el asiento de sueldos. En la DDJJ de IVA viene sumado
// dentro del crédito fiscal, así que el crédito fiscal contable = total de la
// DDJJ menos el 814 del mes.
function cf814DelMes(per){
  let v=0;
  (E.apm[per]||[]).forEach(a=>{
    if(a.tipo!=="POR DEVENGAMIENTO DE SUELDOS")return;
    a.lineas.forEach(l=>{if(l.cuenta==="CREDITO FISCAL DTO 814"&&l._t==="D")v+=pn(l.debe);});
  });
  return v;
}
function recalcDerivados(a,per){
  if(a.ddjjContrib!=null){
    const l8=a.lineas.find(l=>l.cuenta==="CREDITO FISCAL DTO 814"&&l._t==="D");
    const lc=a.lineas.find(l=>l.cuenta==="CARGAS SOCIALES"&&l._t==="D");
    if(lc){lc.debe=numStr(a.ddjjContrib-(l8?pn(l8.debe):0));lc.haber="";lc.derivado=true;}
  }
  if(a.ddjjCF!=null){
    const l8=a.lineas.find(l=>l.cuenta==="CREDITO FISCAL DTO 814"&&l._t==="H");
    if(l8&&!a.manual814){l8.haber=numStr(cf814DelMes(per));l8.debe="";}
    const lc=a.lineas.find(l=>l.cuenta==="D.G.I. I.V.A. CRÉDITO FISCAL"&&l._t==="H");
    if(lc){lc.haber=numStr(a.ddjjCF-(l8?pn(l8.haber):0));lc.debe="";lc.derivado=true;}
  }
}

// ─── CONFIRMACIÓN GENÉRICA ───────────────────────────────────────────────────
function impAcc(i,v){E.imp.acc[i]=v;render();}
function impExiste(per,tipo){return (E.apm[per]||[]).some(a=>a.tipo===tipo);}
function impConfirmar(){
  const p=E.imp.prop;if(!p||!p.items.length)return;
  let n=0;
  p.items.forEach((it,idx)=>{
    const acc=E.imp.acc[idx]||(impExiste(it.per,it.tipo)?"reemplazar":"agregar");
    if(acc==="omitir")return;
    const lista=[...(E.apm[it.per]||[])];
    if(it.patch){
      let a=lista.find(x=>x.tipo===it.tipo);
      if(!a){a=crA(it.tipo);lista.push(a);}
      let l=a.lineas.find(x=>x.cuenta===it.patch.cuenta&&x._t===it.patch.t);
      if(!l){
        l={id:nid(),cuenta:it.patch.cuenta,codigo:cod(it.patch.cuenta),ccodigo:ccod(it.patch.cuenta),
           debe:"",haber:"",_t:it.patch.t,formula:false,autoSplit:null,swing:null};
        const iC=a.lineas.findIndex(x=>x.formula);
        if(iC>=0)a.lineas.splice(iC,0,l);else a.lineas.push(l);
      }
      const campo=it.patch.t==="D"?"debe":"haber";
      const base=acc==="sumar"?pn(l[campo]):0;
      l[campo]=numStr(base+it.patch.monto);
      l[it.patch.t==="D"?"haber":"debe"]="";
    }else{
      const a=buildDesdePlantilla(it.tipo,it.valores,it.meta);
      const i=lista.findIndex(x=>x.tipo===it.tipo);
      if(acc==="reemplazar"&&i>=0)lista[i]=a;else lista.push(a);
      recalcDerivados(a,it.per);
    }
    E.apm={...E.apm,[it.per]:lista};
    n++;
  });
  const primerPer=p.items.length?p.items[0].per:E.mes;
  impReset();
  E.vista="carga";E.mes=primerPer;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.v==="carga"));
  render();
  alert("Importación completa: "+n+" asiento(s).");
}

// ─── 1. BANCO ────────────────────────────────────────────────────────────────
function impArchivoBanco(input){
  const f=input.files&&input.files[0];if(!f)return;
  E.imp.archivo=f.name;E.imp.err="";
  leerExcel(f,rows=>{
    try{
      const cfg=BANCOS_IMPORT[E.imp.bank];
      const hi=rows.findIndex(r=>r&&r.some(c=>/^cuenta$/i.test(String(c||"").trim())));
      if(hi<0)throw new Error("no encontré la columna 'cuenta'");
      const H=rows[hi].map(c=>String(c||"").trim().toLowerCase());
      const iM=H.findIndex(h=>h==="mes"||h==="fecha"),iC=H.indexOf("cuenta"),iI=H.findIndex(h=>h.includes("importe"));
      if(iM<0||iI<0)throw new Error("faltan las columnas 'mes' e 'Importe Pesos'");
      const agg={};let fuera=0,ilegibles=0;const noEnc=new Set();
      for(let r=hi+1;r<rows.length;r++){
        const f2=rows[r];if(!f2)continue;
        const ym=ymCelda(f2[iM]);
        const cta=String(f2[iC]==null?"":f2[iC]).trim();
        const v=numExcel(f2[iI]);
        if(!cta||!v)continue;
        if(!ym){ilegibles++;continue;}
        const per=perDeFecha(ym.y,ym.m);
        if(per<0){fuera++;continue;}
        if(!cod(cta))noEnc.add(cta);
        const k=per+"|"+cta;agg[k]=(agg[k]||0)+v;
      }
      const porPer={};
      Object.keys(agg).forEach(k=>{
        const i=k.indexOf("|"),per=parseInt(k.slice(0,i)),cta=k.slice(i+1),v=agg[k];
        if(Math.abs(v)<0.01)return;
        (porPer[per]=porPer[per]||{})[cta]=v;
      });
      const items=[];
      Object.keys(porPer).map(Number).sort((a,b)=>a-b).forEach(per=>{
        const ing={},egr={};let hayI=false,hayE=false;
        Object.keys(porPer[per]).forEach(c=>{
          const v=porPer[per][c];
          if(v>0){ing[c+"|H"]=v;hayI=true;}else{egr[c+"|D"]=-v;hayE=true;}
        });
        if(hayI)items.push({per,tipo:cfg.tipoIngreso,valores:ing});
        if(hayE)items.push({per,tipo:cfg.tipoEgreso,valores:egr});
      });
      const av=[];
      if(fuera)av.push(fuera+" movimientos quedaron afuera: su fecha no cae dentro del ejercicio "+ejLabel()+" ("+ejRango(getEj())+").");
      if(ilegibles)av.push(ilegibles+" filas tienen una fecha que no pude interpretar.");
      if(noEnc.size)av.push("Cuentas que no están en el Plan de Cuentas: "+[...noEnc].join(", ")+". Se importan igual pero quedan sin código.");
      E.imp.prop={origen:"banco",items};E.imp.avisos=av;E.imp.acc={};
      render();
    }catch(err){impError("No pude procesar el archivo: "+err.message);}
  });
}

// ─── 2. COMPRAS ──────────────────────────────────────────────────────────────
function mapCompra(nombre){
  const m=DB.mapCompras||{};
  if(m[nombre]!==undefined)return m[nombre];
  if(MC.some(x=>x.n===nombre))return nombre;
  return "";
}
function mapCompraSet(k,v){
  if(!DB.mapCompras)DB.mapCompras={};
  DB.mapCompras[k]=v;
  construirCompras();render();
}
function impArchivoCompras(input){
  const f=input.files&&input.files[0];if(!f)return;
  E.imp.archivo=f.name;E.imp.err="";
  leerExcel(f,rows=>{
    try{
      const hi=rows.findIndex(r=>r&&r.some(c=>/neto\s*gravado/i.test(String(c||""))));
      if(hi<0)throw new Error("no encontré la fila de encabezados (falta 'Neto Gravado')");
      const H=rows[hi].map(c=>String(c||"").trim().toLowerCase());
      const col=(...alts)=>{
        for(const a of alts){const i=H.findIndex(h=>h===a);if(i>=0)return i;}
        for(const a of alts){const i=H.findIndex(h=>h.indexOf(a)>=0);if(i>=0)return i;}
        return -1;
      };
      const iP=col("ddjj","periodo","período"),iF=col("fecha"),iG=col("neto gravado"),
            iN=col("no gravado"),iE=col("exento"),iI=col("iva"),iT=col("total"),iC=col("cuenta");
      if(iG<0||iI<0||iC<0)throw new Error("faltan columnas: se esperan Neto Gravado, IVA y CUENTA");
      const datos={};const det={};let ileg=0,fuera=0,soloTotal=0;
      for(let r=hi+1;r<rows.length;r++){
        const f2=rows[r];if(!f2)continue;
        const ym=(iP>=0?ymCelda(f2[iP]):null)||(iF>=0?ymCelda(f2[iF]):null);
        const cta=String(f2[iC]==null?"":f2[iC]).trim()||"(sin cuenta)";
        let neto=numExcel(f2[iG])+numExcel(iN>=0?f2[iN]:0)+numExcel(iE>=0?f2[iE]:0);
        const iva=numExcel(f2[iI]);
        const tot=iT>=0?numExcel(f2[iT]):0;
        if(!neto&&!iva){if(!tot)continue;neto=tot;soloTotal++;}
        if(!ym){ileg++;continue;}
        det[cta]=true;
        const per=perDeFecha(ym.y,ym.m);
        if(per<0){fuera++;continue;}
        const d=datos[per]=datos[per]||{cuentas:{},iva:0,total:0};
        d.cuentas[cta]=(d.cuentas[cta]||0)+neto;
        d.iva+=iva;d.total+=tot;
      }
      E.imp.raw={origen:"compras",datos,detectadas:Object.keys(det).sort(),ileg,fuera,soloTotal};
      if(!DB.mapCompras)DB.mapCompras={...MAP_COMPRAS_BASE};
      construirCompras();render();
    }catch(err){impError("No pude procesar el archivo: "+err.message);}
  });
}
function construirCompras(){
  const raw=E.imp.raw;if(!raw||raw.origen!=="compras")return;
  const items=[],sinMapa=new Set();
  Object.keys(raw.datos).map(Number).sort((a,b)=>a-b).forEach(per=>{
    const d=raw.datos[per];const val={};let neto=0;
    Object.keys(d.cuentas).forEach(c=>{
      const dest=mapCompra(c);
      if(dest===EXCLUIR)return;
      if(!dest){sinMapa.add(c);return;}
      val[dest+"|D"]=(val[dest+"|D"]||0)+d.cuentas[c];
      neto+=d.cuentas[c];
    });
    if(d.iva)val["D.G.I. I.V.A. CRÉDITO FISCAL|D"]=d.iva;
    if(!Object.keys(val).length)return;
    const dif=d.total-(neto+d.iva);
    items.push({per,tipo:"POR LAS COMPRAS",valores:val,
      nota:Math.abs(dif)>1?"El total del Excel supera a neto + IVA en "+fmtD(dif)+" (percepciones): cargalas a mano.":""});
  });
  const av=[];
  if(raw.fuera)av.push(raw.fuera+" comprobantes quedaron afuera del ejercicio "+ejLabel()+".");
  if(raw.ileg)av.push(raw.ileg+" filas tienen una fecha que no pude interpretar.");
  if(raw.soloTotal)av.push(raw.soloTotal+" comprobantes venían sin discriminar: tomé el Total como neto.");
  if(sinMapa.size)av.push("Sin equivalencia y por eso excluidas: "+[...sinMapa].join(", ")+".");
  E.imp.prop={origen:"compras",items};E.imp.avisos=av;E.imp.acc={};
}

    try{
      const hi=rows.findIndex(r=>r&&r.some(c=>/importe/i.test(String(c||""))));
      if(hi<0)throw new Error("no encontré una columna de Importe");
      const H=rows[hi].map(c=>String(c||"").trim().toLowerCase());
      const iF=H.findIndex(h=>/fecha/.test(h)),iI=H.findIndex(h=>/importe/.test(h)),
            iO=H.findIndex(h=>/operaci/.test(h));
      if(iF<0||iI<0)throw new Error("faltan las columnas de Fecha e Importe");
      const porPer={};let n=0,om=0,fuera=0,ileg=0;
      for(let r=hi+1;r<rows.length;r++){
        const f2=rows[r];if(!f2)continue;
        const v=numExcel(f2[iI]);if(!v)continue;
        const ym=ymCelda(f2[iF]);
        if(!ym){ileg++;continue;}
        if(iO>=0&&!/retenc/i.test(String(f2[iO]||""))){om++;continue;}
        const per=perDeFecha(ym.y,ym.m);
        if(per<0){fuera++;continue;}
        porPer[per]=(porPer[per]||0)+v;n++;
      }
      const items=Object.keys(porPer).map(Number).sort((a,b)=>a-b).map(per=>({
        per,tipo:"POR COBRO DE VENTAS EN CUENTA CORRIENTE",
        patch:{cuenta:cfg.cuenta,t:"D",monto:porPer[per]},
        valores:{},nota:"Retenciones de "+cfg.label+" del mes: "+fmtD(porPer[per])
      }));
      const av=[];
      if(om)av.push(om+" filas se omitieron porque no son retenciones (percepciones, devoluciones).");
      if(fuera)av.push(fuera+" certificados quedaron afuera del ejercicio "+ejLabel()+".");
      if(ileg)av.push(ileg+" filas tienen una fecha que no pude interpretar.");
      av.push("Se carga la línea "+cfg.cuenta+" del asiento de cobro de ventas. Si el asiento no existe todavía, se crea.");
      E.imp.prop={origen:"reten",items};E.imp.avisos=av;E.imp.acc={};render();
    }catch(err){impError("No pude procesar el archivo: "+err.message);}
  });
}

function esCtaResultado(cta){
  const m=DB.cuentas.find(x=>x.n===cta);
  if(!m)return false;
  const c=(m.c&&m.c!=="XXXXX")?m.c:(m.cc||"");
  return c&&(c[0]==="3"||c[0]==="4");
}
// Saldo neto (Debe - Haber) de cada cuenta al cierre de un ejercicio
function saldosFinales(ejId){
  const out={};
  const si=DB.saldos[ejId]||{};
  Object.keys(si).forEach(c=>{out[c]=(out[c]||0)+(si[c].d||0)-(si[c].h||0);});
  const per=DB.asientos[ejId]||{};
  Object.keys(per).forEach(k=>{
    (per[k]||[]).forEach(a=>a.lineas.forEach(l=>{
      if(!l.cuenta)return;
      let d=pn(l.debe),hv=pn(l.haber);
      if(l.formula){const v=calcFormula(a,l);if(l._t==="D")d=v;else hv=v;}
      out[l.cuenta]=(out[l.cuenta]||0)+d-hv;
    }));
  });
  return out;
}
async function arrastrarSaldos(){
  const ej=getEj();if(!ej)return;
  const prev=ejAnterior(ej);
  if(!prev){alert("No hay un ejercicio anterior cargado para "+empLabel()+".");return;}
  try{await traerEjercicio(prev.id);}catch(e){alert("No pude leer el ejercicio anterior: "+fbErr(e));return;}
  const el=document.getElementById("si-refundir");
  const refundir=el?el.checked:true;
  if(Object.keys(SALDOS_INIT).length&&
     !confirm("Esto reemplaza los saldos iniciales actuales por los saldos de cierre de «"+prev.nom+"». ¿Seguir?"))return;
  const fin=saldosFinales(prev.id);
  const nuevo={};let rdo=0;
  Object.keys(fin).forEach(c=>{
    const v=fin[c];
    if(Math.abs(v)<0.005)return;
    if(refundir&&esCtaResultado(c)){rdo+=v;return;}
    nuevo[c]=v>0?{d:v,h:0}:{d:0,h:-v};
  });
  if(refundir&&Math.abs(rdo)>=0.005){
    const rna="RESULTADOS NO ASIGNADOS";
    const base=nuevo[rna]?(nuevo[rna].d-nuevo[rna].h):0;
    const t=base+rdo;
    nuevo[rna]=t>0?{d:t,h:0}:{d:0,h:-t};
  }
  DB.saldos[ej.id]=nuevo;SALDOS_INIT=nuevo;
  render();
  alert("Listo: se trajeron "+Object.keys(nuevo).length+" cuentas desde el cierre de «"+prev.nom+"»."+
    (refundir?"\n\nLas cuentas de resultado se refundieron en Resultados No Asignados.":""));
}

// ─── SALIDAS ──────────────────────────────────────────────────────────────────
// Formato chino: numeración correlativa por mes (todos los del mes en orden)
// Los asientos se numeran considerando todos los meses en orden, pero al exportar
// un mes se muestra la correlativa acumulada hasta ese mes.
function getChino(){
  const f=fechaFinPer(E.mes);
  // Número de asiento acumulado de meses anteriores
  let prevCount=0;
  for(let m=0;m<E.mes;m++){prevCount+=(E.apm[m]||[]).length;}
  return getMes().flatMap((a,ai)=>{
    const rows=[];let pi=0;
    a.lineas.forEach(l=>{
      let d=pn(l.debe),h=pn(l.haber);
      if(l.formula){const v=calcFormula(a,l);if(l._t==="D")d=v;else h=v;}
      if(d===0&&h===0)return;
      const cc=l.ccodigo||ccod(l.cuenta)||"XXXXX";
      const ccDesc=chinoDesc(cc);
      pi++;rows.push({nA:prevCount+ai+1,nP:pi,fecha:f,concepto:a.tipo,
        codigo:l.codigo||cod(l.cuenta)||"XXXXX",
        ccodigo:cc,ccodigoDesc:ccDesc,
        importe:d?d:-h,cuenta:l.cuenta,esFormula:l.formula});
    });
    return rows;
  });
}

// Formato chino AGRUPADO: agrupa por código alternativo dentro del mismo asiento
function getChinoAgrupado(){
  const f=fechaFinPer(E.mes);
  let prevCount=0;
  for(let m=0;m<E.mes;m++){prevCount+=(E.apm[m]||[]).length;}
  return getMes().flatMap((a,ai)=>{
    // Agrupar líneas por ccodigo
    const grupos={};
    a.lineas.forEach(l=>{
      let d=pn(l.debe),h=pn(l.haber);
      if(l.formula){const v=calcFormula(a,l);if(l._t==="D")d=v;else h=v;}
      if(d===0&&h===0)return;
      const cc=l.ccodigo||ccod(l.cuenta)||"XXXXX";
      const importe=d?d:-h;
      if(!grupos[cc])grupos[cc]={cc,desc:chinoDesc(cc),importe:0,cuentas:[]};
      grupos[cc].importe+=importe;
      grupos[cc].cuentas.push(l.cuenta);
    });
    let pi=0;
    return Object.values(grupos).map(g=>{
      pi++;
      return{nA:prevCount+ai+1,nP:pi,fecha:f,concepto:a.tipo,
        ccodigo:g.cc,ccDesc:g.desc,importe:g.importe,cuentas:g.cuentas.join(" / ")};
    });
  });
}

function getTodosAsientos(){
  // Devuelve todos los asientos de todos los meses, con el mes al que pertenecen
  const todos=[];
  for(let m=0;m<nPer();m++){
    (E.apm[m]||[]).forEach(a=>todos.push({...a,_mes:m}));
  }
  return todos;
}

function getMayores(){
  // Acumula movimientos de TODOS los meses
  const map={};
  const movPorMes={}; // para desglosar por mes si se quiere
  getTodosAsientos().forEach(a=>{
    a.lineas.forEach(l=>{
      const c=l.cuenta||"(sin cuenta)";
      if(!map[c])map[c]={cuenta:c,codigo:l.codigo||cod(l.cuenta)||"",debe:0,haber:0,porMes:{}};
      let d=pn(l.debe),h=pn(l.haber);
      if(l.formula){const v=calcFormula(a,l);if(l._t==="D")d=v;else h=v;}
      map[c].debe+=d;map[c].haber+=h;
      if(!map[c].porMes[a._mes])map[c].porMes[a._mes]={d:0,h:0};
      map[c].porMes[a._mes].d+=d;
      map[c].porMes[a._mes].h+=h;
    });
  });
  Object.keys(SALDOS_INIT).forEach(c=>{if(!map[c])map[c]={cuenta:c,codigo:cod(c)||"",debe:0,haber:0,porMes:{}};});
  return Object.values(map).sort((a,b)=>a.cuenta.localeCompare(b.cuenta));
}

// Mayor Chino: agrupa movimientos de TODOS los meses por código alternativo
function getMayorChino(){
  const map={};
  getTodosAsientos().forEach(a=>{
    a.lineas.forEach(l=>{
      const cc=l.ccodigo||ccod(l.cuenta)||"XXXXX";
      if(!map[cc])map[cc]={cc,desc:chinoDesc(cc),debe:0,haber:0};
      let d=pn(l.debe),h=pn(l.haber);
      if(l.formula){const v=calcFormula(a,l);if(l._t==="D")d=v;else h=v;}
      map[cc].debe+=d;map[cc].haber+=h;
    });
  });
  return Object.values(map).sort((a,b)=>a.cc.localeCompare(b.cc));
}

// Total general acumulado de todos los meses (para el cuadre en Mayores)
function tGTodos(){
  const todos=getTodosAsientos();
  const d=todos.reduce((s,a)=>s+a.lineas.reduce((ss,l)=>ss+pn(l.debe)+(l.formula&&l._t==="D"?calcFormula(a,l):0),0),0);
  const h=todos.reduce((s,a)=>s+a.lineas.reduce((ss,l)=>ss+pn(l.haber)+(l.formula&&l._t==="H"?calcFormula(a,l):0),0),0);
  return{d,h,ok:Math.abs(d-h)<0.02};
}

// ─── EXPORTACIÓN A EXCEL (.xls) ───────────────────────────────────────────────
// Genera un archivo Excel real (SpreadsheetML) con el formato de la planilla:
// encabezado naranja con filtros, 6 columnas, fecha d/m/aaaa, importes numéricos
function xmlEsc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function buildXLS(filas, nombreHoja){
  // filas: array de {nA,nP,fecha,concepto,codigo,importe}
  const nRows=filas.length+1;
  let xml=`<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="hd">
   <Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="11"/>
   <Interior ss:Color="#ED7D31" ss:Pattern="Solid"/>
   <Alignment ss:Horizontal="Center" ss:Vertical="Center"/>
   <Borders>
    <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>
    <Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#FFFFFF"/>
    <Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#FFFFFF"/>
   </Borders>
  </Style>
  <Style ss:ID="num"><NumberFormat ss:Format="General"/></Style>
  <Style ss:ID="txt"/>
 </Styles>
 <Worksheet ss:Name="${xmlEsc(nombreHoja)}">
  <Names><NamedRange ss:Name="_FilterDatabase" ss:RefersTo="='${xmlEsc(nombreHoja)}'!R1C1:R${nRows}C6" ss:Hidden="1"/></Names>
  <Table>
   <Column ss:Width="70"/><Column ss:Width="60"/><Column ss:Width="70"/>
   <Column ss:Width="300"/><Column ss:Width="90"/><Column ss:Width="110"/>
   <Row ss:Height="18">
    <Cell ss:StyleID="hd"><Data ss:Type="String">N\xBA Asiento</Data></Cell>
    <Cell ss:StyleID="hd"><Data ss:Type="String">N\xBA Pase</Data></Cell>
    <Cell ss:StyleID="hd"><Data ss:Type="String">Fecha</Data></Cell>
    <Cell ss:StyleID="hd"><Data ss:Type="String">Concepto</Data></Cell>
    <Cell ss:StyleID="hd"><Data ss:Type="String">C\xF3digo Cuenta</Data></Cell>
    <Cell ss:StyleID="hd"><Data ss:Type="String">Importe</Data></Cell>
   </Row>`;
  filas.forEach(r=>{
    xml+=`
   <Row>
    <Cell ss:StyleID="num"><Data ss:Type="Number">${r.nA}</Data></Cell>
    <Cell ss:StyleID="num"><Data ss:Type="Number">${r.nP}</Data></Cell>
    <Cell ss:StyleID="txt"><Data ss:Type="String">${fechaExp(r.fecha)}</Data></Cell>
    <Cell ss:StyleID="txt"><Data ss:Type="String">${xmlEsc(r.concepto)}</Data></Cell>
    <Cell ss:StyleID="txt"><Data ss:Type="String">${xmlEsc(r.codigo)}</Data></Cell>
    <Cell ss:StyleID="num"><Data ss:Type="Number">${r.importe.toFixed(2)}</Data></Cell>
   </Row>`;
  });
  xml+=`
  </Table>
  <AutoFilter x:Range="R1C1:R${nRows}C6" xmlns="urn:schemas-microsoft-com:office:excel"/>
  <x:WorksheetOptions><x:FreezePanes/><x:SplitHorizontal>1</x:SplitHorizontal><x:TopRowBottomPane>1</x:TopRowBottomPane></x:WorksheetOptions>
 </Worksheet>
</Workbook>`;
  return xml;
}

// ─── MAESTRO ──────────────────────────────────────────────────────────────────
function gCta(){
  const n=document.getElementById("nc-n")?.value.trim();
  const c=document.getElementById("nc-c")?.value.trim()||"XXXXX";
  const cc=document.getElementById("nc-cc")?.value||"XXXXX";
  if(!n)return;
  if(E.ecta){MC=MC.map(m=>m.n===E.ecta?{n,c,cc}:m);E.ecta=null;}
  else{MC=[...MC,{n,c,cc}];}
  DB.cuentas=MC;render();
}
function eCta(n){E.ecta=n;render();setTimeout(()=>{const m=MC.find(x=>x.n===n);if(!m)return;const ni=document.getElementById("nc-n"),ci=document.getElementById("nc-c"),cci=document.getElementById("nc-cc");if(ni)ni.value=m.n;if(ci)ci.value=m.c;if(cci)cci.value=m.cc||"XXXXX";},10);}
function dCta(n){
  const uso=cuentaEnUso(n);
  if(uso&&!confirm("La cuenta \""+n+"\" está usada en "+uso+" línea(s) de asientos. Si la borrás, esas líneas quedan con una cuenta que ya no existe en el maestro.\n\n¿Seguir?"))return;
  MC=MC.filter(m=>m.n!==n);DB.cuentas=MC;render();
}
function cuentaEnUso(n){
  let k=0;
  Object.keys(DB.asientos).forEach(ej=>Object.keys(DB.asientos[ej]||{}).forEach(p=>
    (DB.asientos[ej][p]||[]).forEach(a=>a.lineas.forEach(l=>{if(l.cuenta===n)k++;}))));
  return k;
}
// Edición en línea del maestro. Renombrar arrastra el cambio a los asientos y
// saldos de todos los ejercicios; cambiar un código lo refresca en las líneas
// ya cargadas, salvo las que tengan el código chino pisado a mano.
function ctaUpd(nombre,campo,v){
  const m=MC.find(x=>x.n===nombre);if(!m)return;
  if(campo==="n"){
    const nuevo=String(v).trim();
    if(!nuevo||nuevo===nombre)return render();
    if(MC.some(x=>x.n===nuevo)){alert("Ya existe una cuenta con ese nombre.");return render();}
    m.n=nuevo;
    Object.keys(DB.asientos).forEach(ej=>Object.keys(DB.asientos[ej]||{}).forEach(p=>
      (DB.asientos[ej][p]||[]).forEach(a=>a.lineas.forEach(l=>{if(l.cuenta===nombre)l.cuenta=nuevo;}))));
    Object.keys(DB.saldos).forEach(ej=>{
      const t=DB.saldos[ej];
      if(t&&t[nombre]!==undefined){t[nuevo]=t[nombre];delete t[nombre];}
    });
    Object.keys(DB.mapCompras||{}).forEach(k=>{if(DB.mapCompras[k]===nombre)DB.mapCompras[k]=nuevo;});
  }
  else if(campo==="c")m.c=String(v).trim()||"XXXXX";
  else if(campo==="cc")m.cc=v||"XXXXX";
  DB.cuentas=MC;
  sincronizarCodigos();
  render();
}
function sincronizarCodigos(){
  Object.keys(DB.asientos).forEach(ej=>Object.keys(DB.asientos[ej]||{}).forEach(p=>
    (DB.asientos[ej][p]||[]).forEach(a=>a.lineas.forEach(l=>{
      if(!l.cuenta)return;
      const m=MC.find(x=>x.n===l.cuenta);
      if(!m)return;
      l.codigo=m.c;
      if(!l.ccManual)l.ccodigo=m.cc||"XXXXX";
    }))));
}
// Aplica un código chino a varias cuentas de una (ej: todos los planes de pago)
function ctaMasivo(){
  const cc=document.getElementById("mas-cc").value;
  const sel=[...document.querySelectorAll(".cta-chk:checked")].map(x=>x.dataset.n);
  if(!sel.length){alert("Marcá al menos una cuenta.");return;}
  sel.forEach(n=>{const m=MC.find(x=>x.n===n);if(m)m.cc=cc;});
  DB.cuentas=MC;sincronizarCodigos();render();
}
function canCta(){E.ecta=null;render();}

      <div style="flex:1"></div>
      <button class="btn sm outline-v">${genAb?"&#9660;":"&#9654;"}</button></div>`;
    if(genAb){
      h+=`<div style="padding:12px 16px">`;
      INST_GENERAL.forEach(g=>{
        h+=`<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#111;margin-bottom:2px">${esc(g.tit)}</div>
          <div style="font-size:12px;color:#374151;line-height:1.5">${g.txt}</div></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;

    if(!items.length)h+=`<div class="empty">No hay resultados para «${esc(E.instQ)}».</div>`;

    items.forEach(({x,i})=>{
      const k="i"+i;const ab=!!E.instOpen[k];
      h+=`<div class="card"><div class="card-head" style="cursor:pointer" onclick="togInst('${k}')">
        <span class="badge bl">${i+1}</span>
        <span style="font-weight:700;font-size:12px;color:#111">${esc(x.t)}</span>
        <div style="flex:1"></div>
        <button class="btn sm outline-v">${ab?"&#9660;":"&#9654;"}</button></div>`;
      if(ab){
        h+=`<div style="padding:12px 16px">
          <div style="font-size:11px;text-transform:uppercase;font-weight:700;color:#64748b;margin-bottom:3px">De dónde sale</div>
          <div style="font-size:12px;color:#374151;margin-bottom:12px">${x.o}</div>
          <div style="font-size:11px;text-transform:uppercase;font-weight:700;color:#64748b;margin-bottom:5px">Cómo se carga</div>
          <ol style="margin:0 0 12px 18px;padding:0">`;
        x.p.forEach(s=>h+=`<li style="font-size:12px;color:#374151;line-height:1.6;margin-bottom:4px">${s}</li>`);
        h+=`</ol>`;
        if(x.x){
          h+=`<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:7px;padding:8px 11px;font-size:12px;color:#92400e;line-height:1.5">
            <b>&#x26A0; Ojo:</b> ${x.x}</div>`;
        }
        h+=`</div>`;
      }
      h+=`</div>`;
    });
    app.innerHTML=h;
  }

  else if(E.vista==="importar"){
    const sub=E.imp.sub||"banco";
    let h=`<div class="toolbar"><h2>Importar</h2>
      <span class="mini">${esc(empLabel())} &middot; ejercicio ${esc(ejLabel())} (${esc(getEj()?ejRango(getEj()):"")})</span></div>`;
    h+=`<div class="subtabs">`;
    IMP_SUBS.forEach(s=>h+=`<button class="subtab ${sub===s.k?"on":""}" onclick="impSub('${s.k}')">${esc(s.l)}</button>`);
    h+=`</div>`;

    const caja=(titulo,ayuda,acepta,handler,extra)=>`
      <div class="card" style="padding:16px;margin-bottom:12px">
        ${extra||""}
        <div style="font-size:13px;font-weight:700;margin-bottom:6px">${titulo}</div>
        <div class="mini" style="margin-bottom:10px;line-height:1.5">${ayuda}</div>
        <input type="file" accept="${acepta}" onchange="${handler}(this)">
        ${E.imp.archivo?`<span class="badge bl" style="margin-left:8px">${esc(E.imp.archivo)}</span>`:""}
      </div>`;

    if(sub==="banco"){
      let bh=`<div style="font-size:13px;font-weight:700;margin-bottom:8px">1. Elegí el banco</div>
        <div style="display:flex;gap:8px;margin-bottom:14px">`;
      Object.keys(BANCOS_IMPORT).forEach(k=>bh+=`<button class="btn ${E.imp.bank===k?"primary":""} sm" onclick="impSetBank('${k}')">${esc(BANCOS_IMPORT[k].label)}</button>`);
      bh+=`</div>`;
      h+=caja("2. Subí el Excel de movimientos",
        "Columnas esperadas: <b>mes</b> (fecha del movimiento), <b>cuenta</b> (nombre exacto del Plan de Cuentas) e <b>Importe Pesos</b>. Los movimientos de una misma cuenta y mes se netean entre sí: si el neto queda positivo va al asiento de Ingresos, si queda negativo al de Egresos. La cuenta del banco se calcula sola por diferencia.",
        ".xlsx,.xls","impArchivoBanco",bh);
    }
    else if(sub==="compras"){
      h+=caja("Subí el resumen de compras",
        "Columnas esperadas: <b>DDJJ</b> o <b>Fecha</b>, <b>Neto Gravado</b>, <b>No Gravado</b>, <b>Exento</b>, <b>IVA</b>, <b>Total</b> y <b>CUENTA</b>. Agrupa por mes y por cuenta: el neto va al Debe de la cuenta de gasto, el IVA a Crédito Fiscal, y Proveedores queda como línea de cierre. La parte pagada al contado la cargás vos en Caja.",
        ".xlsx,.xls","impArchivoCompras");
      if(E.imp.raw&&E.imp.raw.origen==="compras"){
        h+=`<div class="card" style="padding:14px;margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px">Equivalencia de cuentas</div>
          <div class="mini" style="margin-bottom:10px">Cómo se imputa cada valor de la columna CUENTA del Excel. Se guarda, así que esto se hace una sola vez.</div>
          <table class="emp"><thead><tr><th>En el Excel</th><th style="width:340px">Se imputa a</th></tr></thead><tbody>`;
        E.imp.raw.detectadas.forEach(c=>{
          const dest=mapCompra(c);
          h+=`<tr><td>${esc(c)}</td><td>
            <select class="fi" style="width:100%" onchange="mapCompraSet('${esc(c)}',this.value)">
              <option value="" ${dest===""?"selected":""}>&mdash; sin asignar (no se importa) &mdash;</option>
              <option value="${EXCLUIR}" ${dest===EXCLUIR?"selected":""}>Excluir</option>
              ${MC.map(m=>`<option value="${esc(m.n)}" ${dest===m.n?"selected":""}>${esc(m.n)}</option>`).join("")}
            </select></td></tr>`;
        });
        h+=`</tbody></table></div>`;
      }
    }
    else if(sub==="iibb"){
      h+=caja("Subí la DDJJ de Ingresos Brutos (PDF)",
        "Del PDF de la DGR San Juan toma el <b>período</b>, el <b>Total Impuesto Determinado</b> y el <b>Total Retenciones y Percepciones</b>. El vuelco entre «a pagar» y «saldo a favor» lo resuelve la fórmula del asiento. También cruza el saldo a favor del mes anterior contra el que viene arrastrando el sistema.",
        ".pdf","impArchivoIIBB");
    }
    else if(sub==="iva"){
      h+=caja("Subí la DDJJ de IVA (PDF F.2051)",
        "Toma el <b>débito fiscal</b>, el <b>crédito fiscal</b> y el <b>total de retenciones y percepciones</b>. Como el crédito fiscal de la DDJJ incluye el DTO 814, se le resta el 814 que tengas cargado en el asiento de sueldos de ese mes, y queda vinculado: si después cambiás el 814, el crédito fiscal se ajusta solo.",
        ".pdf","impArchivoIVA");
    }
    else if(sub==="f931"){
      h+=caja("Subí el F.931 (PDF)",
        "De la sección <b>Montos que se ingresan</b> suma las contribuciones patronales (códigos 351, 352, 312, 028, 360, 270 y 935) y los aportes retenidos al personal (301 y 302). Carga Cargas Sociales al Debe y Cargas Sociales a Pagar al Haber.",
        ".pdf","impArchivo931");
    }
    else if(sub==="reten"){
      let rh=`<div style="font-size:13px;font-weight:700;margin-bottom:8px">1. Qué retención es</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">`;
      Object.keys(RETEN_TIPOS).forEach(k=>rh+=`<button class="btn ${(E.imp.reten||"GANANCIAS")===k?"primary":""} sm" onclick="impSetReten('${k}')">${esc(RETEN_TIPOS[k].label)}</button>`);
      rh+=`</div>`;
      h+=caja("2. Subí el Excel de retenciones sufridas",
        "Columnas esperadas: una de <b>Fecha</b> y una de <b>Importe</b>; si hay una de <b>Operación</b> o <b>Descripción</b> se toman solo las retenciones y se dejan afuera las percepciones. Totaliza por mes y carga la línea correspondiente del asiento de cobro de ventas en cuenta corriente.",
        ".xlsx,.xls","impArchivoReten",rh);
    }

    if(E.imp.err){
      h+=`<div class="card" style="padding:12px 16px;margin-bottom:12px;background:#fee2e2;border-color:#fca5a5">
        <div style="font-size:12px;font-weight:700;color:#991b1b">&#x2717; ${esc(E.imp.err)}</div></div>`;
    }
    if(E.imp.avisos&&E.imp.avisos.length){
      h+=`<div class="card" style="padding:12px 16px;margin-bottom:12px;background:#fef3c7;border-color:#fde68a">
        ${E.imp.avisos.map(a=>`<div style="font-size:12px;color:#92400e;margin-bottom:3px">&#x26A0; ${a}</div>`).join("")}</div>`;
    }

    const p=E.imp.prop;
    if(p){
      if(!p.items.length){
        h+=`<div class="empty">El archivo se leyó pero no quedó nada para importar en este ejercicio.</div>`;
      }else{
        h+=`<div class="toolbar"><h2 style="font-size:14px">Revisá y confirmá</h2>
          <span class="badge bl">${p.items.length} asiento(s)</span>
          <div style="flex:1"></div>
          <button class="btn sm" onclick="impCancelar()">Cancelar</button>
          <button class="btn primary sm" onclick="impConfirmar()">&#x2713; Confirmar e importar</button></div>`;
        p.items.forEach((it,idx)=>{
          const existe=impExiste(it.per,it.tipo);
          const acc=E.imp.acc[idx]||(existe?(it.patch?"reemplazar":"reemplazar"):"agregar");
          h+=`<div class="card"><div class="card-head">
            <span class="badge bl">${esc(perLabel(it.per))}</span>
            <span style="font-size:12px;font-weight:600">${esc(it.tipo)}</span>
            <div style="flex:1"></div>`;
          if(existe){
            const op=(v,l)=>`<label style="font-size:11px;display:inline-flex;align-items:center;gap:3px;margin-left:8px">
              <input type="radio" name="acc${idx}" ${acc===v?"checked":""} onchange="impAcc(${idx},'${v}')"> ${l}</label>`;
            h+=`<span class="badge am">Ya existe</span>`+
               op("reemplazar",it.patch?"Reemplazar importe":"Reemplazar")+
               op(it.patch?"sumar":"agregar",it.patch?"Sumar":"Agregar otro")+
               op("omitir","Omitir");
          }else h+=`<span class="badge gn">Nuevo</span>`;
          h+=`</div>`;
          if(it.nota)h+=`<div style="padding:6px 14px;background:#eff6ff;border-bottom:1px solid #dbeafe;font-size:11px;color:#1e40af">${it.nota}</div>`;
          h+=`<table class="ct" style="font-size:12px"><thead><tr>
            <th style="width:40px">D/H</th><th>Cuenta</th><th style="width:160px;text-align:right">Importe</th>
          </tr></thead><tbody>`;
          if(it.patch){
            h+=`<tr><td><span class="badge gn">${it.patch.t}</span></td>
              <td>${esc(it.patch.cuenta)}</td>
              <td style="text-align:right;font-family:monospace">${fmtD(it.patch.monto)}</td></tr>`;
          }else{
            const ks=Object.keys(it.valores);
            ks.sort((a,b)=>{const la=a.slice(a.lastIndexOf("|")+1),lb=b.slice(b.lastIndexOf("|")+1);return la===lb?a.localeCompare(b):(la==="D"?-1:1);});
            ks.forEach(k=>{
              const i=k.lastIndexOf("|"),c=k.slice(0,i),t=k.slice(i+1);
              h+=`<tr><td><span class="badge ${t==="D"?"gn":"am"}">${t}</span></td>
                <td>${esc(c)}${cod(c)?"":' <span class="badge am">sin código</span>'}</td>
                <td style="text-align:right;font-family:monospace;color:${t==="D"?"#059669":"#b45309"}">${fmtD(it.valores[k])}</td></tr>`;
            });
            const sd=ks.filter(k=>k.endsWith("|D")).reduce((s,k)=>s+it.valores[k],0);
            const sh=ks.filter(k=>k.endsWith("|H")).reduce((s,k)=>s+it.valores[k],0);
            h+=`<tr style="background:#f1f5f9;font-weight:700"><td></td>
              <td>Línea de cierre (se calcula sola)</td>
              <td style="text-align:right;font-family:monospace">${fmtD(Math.abs(sd-sh))}</td></tr>`;
          }
          h+=`</tbody></table></div>`;
        });
      }
    }
    app.innerHTML=h;
  }

}

// Render parcial del autocomplete de cuenta
function renderAConly(lid, q){
  const wrap=document.querySelector(`#ci_${lid}`)?.parentElement;
  if(!wrap)return;
  let existing=wrap.querySelector(".ac-list");
  const items=getAC(q);
  if(!items.length){if(existing)existing.remove();return;}
  if(!existing){existing=document.createElement("div");existing.className="ac-list";wrap.appendChild(existing);}
  existing.innerHTML=items.map(it=>`<div class="ac-it" onmousedown="updLRender('${E.acOpen?.aid}','${lid}','cuenta','${esc(it)}')">${esc(it)}</div>`).join("");
}

// Autocomplete para la pantalla de saldos iniciales
function renderSiAC(q){
  const wrap=document.getElementById("si-nc")?.parentElement;
  if(!wrap)return;
  let el=document.getElementById("si-ac-list");
  const items=MC.map(m=>m.n).filter(n=>n.toLowerCase().includes((q||"").toLowerCase())).slice(0,10);
  if(!items.length){if(el)el.innerHTML="";return;}
  if(!el){el=document.createElement("div");el.className="ac-list";el.id="si-ac-list";wrap.appendChild(el);}
  el.innerHTML=items.map(it=>`<div class="ac-it" onmousedown="document.getElementById('si-nc').value='${esc(it)}'">${esc(it)}</div>`).join("");
}

document.addEventListener("click",e=>{
  if(E.drop&&!e.target.closest(".drop-wrap")){E.drop=false;render();}
});

// ─── ARRANQUE ────────────────────────────────────────────────────────────────
// Sin SDK de Firebase (archivo suelto o sin internet) arranca contra el navegador.
function boot(){
  DB=leerLocal()||dbVacia();
  if(!DB.saldos)DB.saldos={};
  if(!DB.asientos)DB.asientos={};
  if(!DB.cuentas||!DB.cuentas.length)DB.cuentas=MC_BASE.map(x=>({...x}));
  if(!DB.mapCompras)DB.mapCompras={...MAP_COMPRAS_BASE};
  MC=DB.cuentas;
  activarEjercicio(DB.ejercicios.length?DB.ejercicios[0].id:null);
  render();
}
if(MODO_LOCAL)boot();else fbInit();
</script>
